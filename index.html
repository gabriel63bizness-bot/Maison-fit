<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maison Fit</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2457f5"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{--bg:#eef2f7;--card:#fff;--tx:#0f1f2e;--mu:#5d6f80;--ac:#2457f5;--on:#fff;--br:#d9e1ea;--ok:#1f9d55;--soft:#e3ebff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1620;--card:#162331;--tx:#eaf1f8;--mu:#93a6b8;--ac:#6b8cff;--on:#0a1020;--br:#263648;--ok:#4cc97f;--soft:#1e2f4d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1620;--card:#162331;--tx:#eaf1f8;--mu:#93a6b8;--ac:#6b8cff;--on:#0a1020;--br:#263648;--ok:#4cc97f;--soft:#1e2f4d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 16px 110px}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;margin:0;letter-spacing:.2px}
h1{font-size:34px;line-height:1.05}h2{font-size:24px;margin:22px 0 10px}h3{font-size:20px}
p{margin:6px 0}.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--br);border-radius:14px;padding:14px;margin:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:1.5px solid var(--br);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--on);font-weight:600}
.btn{background:var(--ac);color:var(--on);border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;width:100%}
.btn.alt{background:var(--soft);color:var(--ac)}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type{text-align:left;background:var(--card);border:1px solid var(--br);border-radius:14px;padding:12px;color:var(--tx);font:inherit;cursor:pointer}
.type b{display:block;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:20px}
.ex{border-top:1px solid var(--br);padding:12px 0}.ex:first-child{border-top:0}
.ex-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.tag{font-size:12px;color:var(--mu)}
.sets{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.set{width:44px;height:44px;border-radius:50%;border:2px solid var(--br);background:transparent;color:var(--tx);font:inherit;font-weight:600;cursor:pointer}
.set.on{background:var(--ok);border-color:var(--ok);color:#fff}
.bar{height:8px;background:var(--br);border-radius:8px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--ok);transition:width .25s}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
select,input[type=time],input[type=text]{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--br);border-radius:10px;padding:8px}
.banner{background:var(--ac);color:var(--on);border-radius:14px;padding:12px 14px;margin:10px 0;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--br);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--mu);font:inherit;font-size:12px;padding:6px 2px;cursor:pointer;min-height:48px}
nav button.on{color:var(--ac);font-weight:700}nav span{display:block;font-size:20px}
details{border-top:1px solid var(--br);padding:10px 0}details:first-of-type{border-top:0}summary{font-weight:600;cursor:pointer}
button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.big{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:110px;font-weight:700;line-height:1;margin:14px 0 0}
.guide{text-align:center}.guide .btn{margin:14px 0}
.stat{display:flex;gap:10px}.stat div{flex:1;background:var(--card);border:1px solid var(--br);border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:32px}
.wk{display:flex;align-items:flex-end;gap:6px;height:90px}.wk i{flex:1;background:var(--ac);border-radius:6px 6px 0 0;min-height:4px}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--br);cursor:pointer}.sw.on{box-shadow:0 0 0 3px var(--tx)}
</style></head><body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
var X=[
["Pompes","haut","",3,10,"reps","Corps aligné, coudes à 45°."],
["Pompes inclinées","haut","chaise",3,12,"reps","Mains sur l’assise, version plus facile."],
["Pompes pike","haut","",3,8,"reps","Hanches hautes pour viser les épaules."],
["Dips sur chaise","haut","chaise",3,10,"reps","Descends doucement, coudes vers l’arrière."],
["Tractions","haut","barre",3,6,"reps","Menton au-dessus de la barre, sans élan."],
["Rowing avec haltère","haut","halteres",3,12,"reps","Dos plat, tire le coude vers la hanche."],
["Développé épaules","haut","halteres",3,10,"reps","Ne cambre pas le dos."],
["Curl biceps","haut","halteres",3,12,"reps","Coudes collés au corps."],
["Rowing élastique","haut","elastique",3,15,"reps","Serre les omoplates en fin de geste."],
["Superman","haut","",3,12,"reps","Décolle bras et jambes, marque une pause."],
["Squats","bas","",4,15,"reps","Genoux dans l’axe des pieds."],
["Fentes alternées","bas","",3,10,"reps","Genou arrière près du sol."],
["Pont fessier","bas","",3,15,"reps","Serre les fessiers en haut."],
["Chaise murale","bas","",3,40,"s","Dos collé au mur, cuisses à l’horizontale."],
["Squat bulgare","bas","chaise",3,8,"reps","Pied arrière sur la chaise."],
["Goblet squat","bas","halteres",4,12,"reps","Haltère contre la poitrine."],
["Squat avec sac à dos","bas","sac",4,15,"reps","Charge le sac avec des livres ou des bouteilles."],
["Marche latérale élastique","bas","elastique",3,15,"reps","Élastique au-dessus des genoux."],
["Planche","core","",3,30,"s","Ventre rentré, corps en ligne droite."],
["Gainage latéral","core","",3,25,"s","Hanche haute, change de côté à chaque série."],
["Relevés de jambes","core","tapis",3,12,"reps","Lombaires plaquées au tapis."],
["Crunch","core","",3,15,"reps","Remonte les épaules, pas la nuque."],
["Mountain climbers","cardio","",3,30,"s","Rythme soutenu, bassin stable."],
["Jumping jacks","cardio","",3,40,"s","Réception douce sur la pointe des pieds."],
["Burpees","cardio","",3,8,"reps","Version sans saut si besoin."],
["Montées de genoux","cardio","",3,30,"s","Genoux à hauteur du bassin."],
["Pompes diamant","haut","",3,8,"reps","Mains en losange sous la poitrine, cible les triceps."],
["Développé couché haltères","haut","halteres",3,10,"reps","Allongé sur le tapis, pousse en expirant."],
["Oiseau avec élastique","haut","elastique",3,15,"reps","Bras tendus, écarte l’élastique en serrant le dos."],
["Soulevé de terre roumain","bas","halteres",3,12,"reps","Dos plat, hanches vers l’arrière, jambes presque tendues."],
["Montées sur chaise","bas","chaise",3,10,"reps","Pousse avec la jambe d’appui, descends lentement."],
["Fentes sautées","bas","",3,10,"reps","Alterne les jambes en l’air, réception amortie."],
["Pont fessier unijambiste","bas","",3,10,"reps","Une jambe tendue, bassin bien horizontal."],
["Bicycle crunch","core","",3,20,"reps","Coude vers le genou opposé, sans tirer sur la nuque."],
["Gainage dynamique","core","tapis",3,10,"reps","Passe de la planche sur les coudes à celle sur les mains."],
["Shadow boxing","cardio","",3,40,"s","Enchaîne directs et crochets, genoux souples."]];
var EQ=[["halteres","Haltères"],["elastique","Élastiques"],["barre","Barre de traction"],["chaise","Chaise"],["sac","Sac à dos lesté"],["tapis","Tapis"]];
var TY={zero:["Sans matériel","🏠","Corps entier, zéro équipement"],full:["Corps entier","⚡","Tout le corps avec ton matériel"],haut:["Haut du corps","💪","Pectoraux, dos, épaules, bras"],bas:["Bas du corps","🦵","Jambes et fessiers"],core:["Abdos & cardio","🔥","Gainage et énergie"]};
var SL={zero:["haut","bas","core","cardio","bas"],full:["haut","bas","core","cardio","bas"],haut:["haut","haut","haut","core"],bas:["bas","bas","bas","core"],core:["core","core","cardio","core","cardio"]};
var DAYS=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
var S={have:[],level:1,plan:{},time:"18:00",remind:false,pick:"zero",done:{},fired:"",log:{},name:"",ac:"",mode:"auto",voice:true,rest:45},tab="today",alert=false;
try{var r=localStorage.getItem("maisonfit");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem("maisonfit",JSON.stringify(S))}catch(e){}}
function dkey(){return new Date().toLocaleDateString("fr-CA")}
function didx(){return(new Date().getDay()+6)%7}
function gen(t){var have=t==="zero"?[]:S.have,used={},out=[];
 SL[t].forEach(function(g){var c=X.filter(function(e){return e[1]===g&&!used[e[0]]&&(!e[2]||have.indexOf(e[2])>-1)}).sort(function(a,b){return(b[2]?1:0)-(a[2]?1:0)})[0];
 if(c){used[c[0]]=1;out.push(c)}});
 var k=[.75,1,1.3][S.level];
 return out.map(function(e){var n=Math.round(e[4]*k);if(e[5]==="s")n=Math.round(n/5)*5;return{n:e[0],eq:e[2],sets:e[3],r:n,u:e[5],tip:e[6]}})}
function today(){var t=S.plan[didx()];return t&&TY[t]?t:S.pick}
function vToday(){var t=today(),L=gen(t),dn=S.done[dkey()]||{},tot=0,ok=0;
 L.forEach(function(e){tot+=e.sets;ok+=Math.min(dn[e.n]||0,e.sets)});
 var min=Math.round(L.reduce(function(a,e){return a+e.sets*1.4},0)+5);
 var h=(alert?'<div class="banner">⏰ C’est l’heure de ta séance !</div>':'')+
 '<p class="mu">'+(S.name?"Salut "+S.name+" · ":"")+DAYS[didx()]+(S.plan[didx()]?' · séance prévue':'')+'</p><h1>'+TY[t][0]+'</h1><p class="mu">'+L.length+' exercices · environ '+min+' min · repos de 45 s entre les séries</p>'+
 '<div class="bar"><i style="width:'+(tot?ok/tot*100:0)+'%"></i></div>'+(ok===tot&&tot?'<div class="banner" style="background:var(--ok);color:#fff">Séance terminée, bravo !</div>':'<p class="mu">'+ok+' / '+tot+' séries faites</p>')+
 '<button class="btn" onclick="gStart()">▶ Démarrer la séance guidée</button><div class="card"><p class="mu">Échauffement : 3 min de mobilité (rotations d’épaules, de hanches, montées de genoux).</p></div><div class="card">';
 L.forEach(function(e,i){var d=dn[e.n]||0,s="";
  for(var j=0;j<e.sets;j++)s+='<button class="set'+(j<d?' on':'')+'" onclick="tick('+i+','+j+')" aria-label="Série '+(j+1)+'">'+(j+1)+'</button>';
  h+='<div class="ex"><div class="ex-h"><h3>'+e.n+'</h3><span class="tag">'+e.sets+' × '+e.r+(e.u==="s"?' s':' reps')+'</span></div><p class="mu">'+e.tip+(e.eq?' · avec '+EQ.filter(function(q){return q[0]===e.eq})[0][1].toLowerCase():'')+'</p><div class="sets">'+s+'</div></div>'});
 return h+'</div>'}
function tick(i,j){var e=gen(today())[i],k=dkey();S.done[k]=S.done[k]||{};S.log[k]=today();S.done[k][e.n]=(S.done[k][e.n]===j+1)?j:j+1;save();render()}
function vSeances(){var h='<h1>Mes séances</h1><p class="mu">Choisis ton matériel : les séances s’adaptent automatiquement.</p><h2>Mon matériel</h2><div class="chips"><button class="chip on" disabled>Aucun (toujours possible)</button>';
 EQ.forEach(function(q){h+='<button class="chip'+(S.have.indexOf(q[0])>-1?' on':'')+'" onclick="togEq(\''+q[0]+'\')">'+q[1]+'</button>'});
 h+='</div><h2>Niveau</h2><div class="chips">';
 ["Débutant","Intermédiaire","Avancé"].forEach(function(n,i){h+='<button class="chip'+(S.level===i?' on':'')+'" onclick="S.level='+i+';save();render()">'+n+'</button>'});
 h+='</div><h2>Choisir une séance</h2><div class="types">';
 Object.keys(TY).forEach(function(k){h+='<button class="type" onclick="S.pick=\''+k+'\';save();go(\'today\')"><span style="font-size:24px">'+TY[k][1]+'</span><b>'+TY[k][0]+'</b><span class="mu">'+TY[k][2]+'</span></button>'});
 h+='</div><p class="mu" style="margin-top:14px">Une séance planifiée pour aujourd’hui a la priorité sur ce choix.</p><h2>Bibliothèque d’exercices</h2><div class="card">';
 var M={haut:"Haut du corps",bas:"Jambes et fessiers",core:"Abdos et gainage",cardio:"Cardio"};
 X.forEach(function(e){h+='<details><summary>'+e[0]+'</summary><p class="mu">'+M[e[1]]+' · '+(e[2]?'avec '+EQ.filter(function(q){return q[0]===e[2]})[0][1].toLowerCase():'sans matériel')+' · '+e[3]+' × '+e[4]+(e[5]==="s"?' s':' reps')+'</p><p>'+e[6]+'</p><p class="mu">Expire pendant l’effort, inspire au retour. Trop dur : réduis les répétitions. Trop facile : ralentis le mouvement.</p></details>'});
 return h+'</div>'}
function togEq(id){var i=S.have.indexOf(id);i>-1?S.have.splice(i,1):S.have.push(id);save();render()}
function vPlan(){var h='<h1>Planning</h1><p class="mu">Prévois tes séances de la semaine, puis active le rappel quotidien.</p><div class="card">';
 DAYS.forEach(function(d,i){var o='<option value="">Repos</option>';
  Object.keys(TY).forEach(function(k){o+='<option value="'+k+'"'+(S.plan[i]===k?' selected':'')+'>'+TY[k][0]+'</option>'});
  h+='<div class="row"><b>'+d+(i===didx()?' ·  aujourd’hui':'')+'</b><select onchange="S.plan['+i+']=this.value;save()" aria-label="Séance du '+d+'">'+o+'</select></div>'});
 h+='</div><h2>Rappel quotidien</h2><div class="card"><div class="row"><span>Heure du rappel</span><input type="time" value="'+S.time+'" onchange="S.time=this.value;save()"></div>'+
 '<button class="btn'+(S.remind?' alt':'')+'" onclick="togRemind()">'+(S.remind?'Désactiver le rappel':'Activer le rappel')+'</button>'+
 '<p class="mu">Le rappel s’affiche les jours où une séance est prévue, tant que cette page est ouverte. Pour une alarme garantie, mets aussi une alarme sur ton téléphone.</p></div>';
 return h}
async function togRemind(){if(!S.remind){try{if("Notification" in window&&Notification.permission==="default")await Notification.requestPermission()}catch(e){}}S.remind=!S.remind;save();render()}
function vTips(){var T=[["Pas de matériel ? Improvise","Sac à dos rempli de livres, bouteilles d’eau de 1,5 L comme haltères, chaise stable pour les dips et les fentes, serviette pour les gainages."],["Échauffe-toi 3 à 5 minutes","Rotations d’épaules et de hanches, squats sans charge, montées de genoux. Cela prépare les articulations."],["Progresse petit à petit","Quand tu fais toutes les séries sans difficulté, ajoute 2 répétitions, ralentis la descente ou passe au niveau suivant."],["Combien de séances ?","Vise 3 à 4 séances par semaine, avec au moins un jour de repos entre deux séances sur les mêmes muscles."],["Soigne la récupération","Dors suffisamment, bois de l’eau et mange des protéines à chaque repas. Les muscles se construisent au repos."],["Reste régulier","Mieux vaut 20 minutes trois fois par semaine qu’une heure une fois. Utilise le rappel et coche tes séries."],["Douleur ou blessure ?","Arrête l’exercice si tu ressens une douleur vive, et demande l’avis d’un professionnel de santé."]];
 var h='<h1>Conseils</h1><p class="mu">Faire du sport à la maison, sans salle.</p><div class="card">';
 T.forEach(function(t){h+='<details><summary>'+t[0]+'</summary><p class="mu">'+t[1]+'</p></details>'});return h+'</div>'}
var G=null,gt=null;
function say(t){if(!S.voice)return;try{var u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function mark(e,n){var k=dkey();S.done[k]=S.done[k]||{};S.log[k]=today();S.done[k][e.n]=Math.max(S.done[k][e.n]||0,n);save()}
function gStart(){var L=gen(today()),st=[];L.forEach(function(e,i){for(var j=0;j<e.sets;j++){st.push({k:"w",e:e,j:j});if(!(i===L.length-1&&j===e.sets-1))st.push({k:"r",n:j<e.sets-1?e:L[i+1]})}});G={st:st,p:0,left:0,timed:false,end:false};gSet();tab="guide";clearInterval(gt);gt=setInterval(gTick,1000);render()}
function gSet(){var s=G.st[G.p];G.timed=s.k==="r"||s.e.u==="s";G.left=s.k==="r"?S.rest:(s.e.u==="s"?s.e.r:0);say(s.k==="r"?"Repos. Prochain exercice : "+s.n.n:s.e.n+", série "+(s.j+1)+" sur "+s.e.sets+(s.e.u==="s"?", "+s.e.r+" secondes":", "+s.e.r+" répétitions"))}
function gTick(){if(!G||G.end||!G.timed)return;G.left--;if(G.left===30||G.left===10)say("Il reste "+G.left+" secondes");else if(G.left>0&&G.left<=3)say(""+G.left);if(G.left<=0){gNext();return}var el=document.getElementById("gt");if(el)el.textContent=G.left}
function gNext(){var s=G.st[G.p];if(s.k==="w")mark(s.e,s.j+1);G.p++;if(G.p>=G.st.length){clearInterval(gt);G.end=true;say("Séance terminée, bravo !")}else gSet();render()}
function gQuit(){clearInterval(gt);try{speechSynthesis.cancel()}catch(e){}G=null;go("today")}
function vGuide(){if(!G)return"";if(G.end)return'<div class="guide"><h1 style="margin-top:40px">Bravo !</h1><p>Séance terminée. Tes séries sont enregistrées dans Progrès.</p><button class="btn" onclick="gQuit()">Retour</button></div>';
 var s=G.st[G.p],r=s.k==="r",h='<div class="guide"><div class="bar"><i style="width:'+G.p/G.st.length*100+'%"></i></div>';
 h+=r?'<h2>Repos</h2><p class="mu">Prochain : '+s.n.n+'</p>':'<h2>'+s.e.n+'</h2><p class="mu">Série '+(s.j+1)+' sur '+s.e.sets+'</p>';
 h+=G.timed?'<div class="big" id="gt">'+G.left+'</div><p class="mu">secondes</p>':'<div class="big">'+s.e.r+'</div><p class="mu">répétitions</p>';
 if(!r)h+='<p>'+s.e.tip+'</p>';
 return h+'<button class="btn" onclick="gNext()">'+(r?'Passer le repos':G.timed?'Passer':'Série terminée ✓')+'</button><div class="chips" style="justify-content:center"><button class="chip" onclick="S.voice=!S.voice;save();render()">'+(S.voice?'🔊 Voix activée':'🔇 Voix coupée')+'</button><button class="chip" onclick="gQuit()">Arrêter</button></div></div>'}
function sets(d){var o=S.done[d]||{},n=0;for(var k in o)n+=o[k];return n}
function ago(n){var d=new Date();d.setDate(d.getDate()-n);return d.toLocaleDateString("fr-CA")}
function streak(){var n=0,i=sets(ago(0))?0:1;while(i<400&&sets(ago(i))){n++;i++}return n}
function vProg(){var ds=Object.keys(S.done).filter(sets),mx=1,w=[],tot=0;
 for(var i=6;i>=0;i--){var d=ago(i),n=sets(d);mx=Math.max(mx,n);tot+=n;w.push([d,n])}
 var h='<h1>Progrès</h1><div class="stat" style="margin-top:12px"><div><b>'+streak()+'</b><span class="mu">jours d’affilée</span></div><div><b>'+ds.length+'</b><span class="mu">séances</span></div><div><b>'+tot+'</b><span class="mu">séries / 7 j</span></div></div><h2>Cette semaine</h2><div class="card"><div class="wk">'+w.map(function(x){return'<i style="height:'+x[1]/mx*100+'%"></i>'}).join("")+'</div><div class="wk" style="height:auto;margin-top:4px">'+w.map(function(x){return'<span class="tag" style="flex:1;text-align:center">'+DAYS[(new Date(x[0]+"T12:00").getDay()+6)%7][0]+'</span>'}).join("")+'</div></div><h2>Historique</h2><div class="card">';
 ds.sort().reverse().slice(0,10).forEach(function(d){h+='<div class="row"><span>'+new Date(d+"T12:00").toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"})+' · '+(TY[S.log[d]]?TY[S.log[d]][0]:"Séance")+'</span><b>'+sets(d)+' séries</b></div>'});
 if(!ds.length)h+='<p class="mu">Ta première séance apparaîtra ici.</p>';
 return h+'</div>'}
